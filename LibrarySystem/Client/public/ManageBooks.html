<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Books</title>
    <link rel="stylesheet" href="css/ManageBooks.css">
    <link rel="stylesheet" href="css/global.css">
</head>

<body>
  <nav class="navbar">
    <div class="nav-links">
      <a href="/">Home</a>
      <a href="login" id="login">Login</a>
      <a href="register">Register</a>
      <a href="about">About Us</a>
      <a href="account" id="account">My Account</a>
      <a id="logout" id="logout">Logout</a> <!-- Logout functionality will be handled by hte js file accompanied to this file -->
    </div>
  </nav>


    <form id="bookForm">
        <h2 class="addBook">Add A Book</h2>
        <input type="text" id="title" name="title" placeholder="Book Title" required>
        <input type="text" id="author" name="author" placeholder="Author" required>
        <input type="text" id="genre" name="genre" placeholder="Genre" required>
        <input type="number" id="year" name="year" placeholder="Publication Year" required>
          
        <div class="upload">
        <label for="image">Upload Cover Image</label>
        <input type="file" name="image" accept="image/*" />
        </div> 

        <div class="upload">
        <label for="file">Upload File</label>
        <input type="file" name="pdf" accept="application/pdf, .pdf" />
        </div> 
        
        <button type="submit">Add Book</button>
      </form>

      <!-- This will be our pop up window for editing -->
      <div class="overlay" id="overlay">
        <div class="popup">
          <h3>Edit Book</h3>
          <form id="EditForm">
            <input type="text" id="title" name="title" placeholder="Book Title" >
            <input type="text" id="author" name="author" placeholder="Author" >
            <input type="text" id="genre" name="genre" placeholder="Genre" >
            <input type="number" id="year" name="year" placeholder="Publication Year" >
            <input type="file" id="image" name="image" accept="image/"  placeholder="Book Cover Image">
            <div class="availability">
            <input type="radio" id="available" name="availability" value="available">
            <label for="available">Available</label>
            <input type="radio" id="unavailable" name="availability" value="unavailable">
            <label for="unavailable">Unavailable</label>
            </div>
            <button id="saveEdits" type="submit">Save</button>
            <button id="closePopup">Close</button>
          </form>
        </div>
      </div>

      <div class="overlayPdf" id="overlayPdf">
        <div class="popupPdf" id="pdfPopUp">
          <iframe width="100%" height="600px" style="border:none;" id="pdfViewer" style="align-items: center;"></iframe>
        </div>
      </div>

    <div id="resultList" class="resultList">

    </div>     
    <script defer src="js/ManageBooks.js"></script>
    <script defer src="js/global.js"></script>
</body>
</html>
