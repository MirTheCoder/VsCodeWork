<!-- This page will allow admin to see all the users in the database along with info about them-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overdue Books</title>
    <link rel="icon" href="static/libraryIcon.png" type="image/png">
    <link rel="stylesheet" href="css/overdue.css">
    <link rel="stylesheet" href="css/global.css">
</head>
<body>
    <!-- This is our navigation bar -->
  <nav class="navbar">
    <div class="nav-links">
      <a href="login" id="login">Login</a>
      <a href="indexPage" id="indexPage">Home</a>
      <a href="register">Register</a>
      <a href="about">About Us</a>
      <a href="account" id="Account">My Account</a>
      <a id="logout">Logout</a> <!-- Logout functionality will be handled by hte js file accompanied to this file -->
    </div>
  </nav>
 
  <h2>Overdue Books</h2>
  <!-- We will use this to give an overview of the amount of books overdue and other important statuses -->
  <div class="overdueOverview"> 
    <div class="amount">
      <img src="./static/emphasis.png" width="100px" height="100px"/>
      <div class="details">
      <h3 id="overdue-num"></h3>
      <p>Overdue Books</p>
      </div>
    </div>

    <div class="amount">
      <img src="./static/books.png" width="100px" height="100px"/>
      <div class="details">
      <h3 id="booksChecked-num"></h3>
      <p>Books Checked Out</p>
      </div>
    </div>

    <div class="amount">
      <img src="./static/userIcon.png" width="100px" height="100px"/>
      <div class="details">
      <h3 id="borrowed-num"></h3>
      <p>Number of Borrowers</p>
      </div>
    </div>
  </div>


  </div>


  <!-- This will hold all the overdue books within our system -->
  <div id="overdueBooksContainer" class="overdue-books-container">
    <p style="text-align: center" id="overdueBooksHolder">There are currently no overdue books</p>

  </div>
   
</body>
<script defer src="js/overdue.js"></script>
<script defer src="js/global.js"></script>
</html>
