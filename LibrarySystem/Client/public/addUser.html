<!DOCTYPE html>
<html lang="en">
    <!-- This page will. allow admin to add users to our database -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add a User</title>
    <link rel="stylesheet" href="css/addUser.css">
</head>

<body>
        <nav class="navbar">
        <div class="nav-links">
        <a href="indexPage" id="IndexPage">Home</a>    
        <a href="login" id="login">Login</a>
        <a href="register">Register</a>
        <a href="about">About Us</a>
        <a href="account" id="Account">My Account</a>
        <a id="logout">Logout</a> <!-- Logout functionality will be handled by hte js file accompanied to this file -->
        </div>
    </nav>


    <form id="userForm">
        <h2 class="addUser">Add a User</h2>
        <input type="text" id="username" name="username" placeholder="Username" required>
        <input type="email" id="email" name="email" placeholder="Email" required>
        <input type="password" id="password" name="password" placeholder="Password" required>
        <input type="number" id="number" name="number" placeholder="Phone Number" pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}" required>
        <button type="submit">Add User</button>
    </form>
</body>
</html>   
    <script defer src="js/addUser.js"></script>
</body>
</html>
