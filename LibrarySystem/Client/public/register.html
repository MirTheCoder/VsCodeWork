<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Library Register</title>
  <link rel="icon" href="static/libraryIcon.png" type="image/png">


  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&family=Inter:wght@400;500&display=swap" rel="stylesheet">


  <link rel="stylesheet" href="css/registration.css">
</head>

<body>
  <!-- Navigation bar -->
  <nav class="navbar">
    <div class="nav-links">
      <a href="indexPage">Home</a>
      <a href="login" id="login">Login</a>
      <a href="about">About Us</a>
      <a href="account" id="Account">My Account</a>
      <a href="#" id="logout">Log Out</a>
    </div>
  </nav>

  <div id="welcomeBack" class="welcomeHolder">

  </div>

    <!-- Form users can register with -->
  <main class="register-container">
    <h2>Create an Account</h2>

    <form class="register-form" id="register-form">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" required placeholder="John123">

      <label for="email">Email</label>
      <input type="email" id="email" name="email" required placeholder="@example.com">

      <label for="phone">Phone Number</label>
      <input
        type="tel"
        id="phone"
        name="phone"
        pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}"
        required
        placeholder="123-456-7890"
      >

      <label for="password">Password</label>
      <input type="password" id="password" name="password" required placeholder="password">

      <label for="confirmPassword">Confirm Password</label>
      <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="password">
      <button type="submit">Register</button>
    </form>
  </main>
    <script src="js/register.js"></script>
</body>
</html>
