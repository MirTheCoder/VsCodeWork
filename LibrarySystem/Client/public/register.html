<!DOCTYPE html>
<html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <nav style="background-color: beige; border:1px solid white;">
        <div>
            <a id="home" href="indexPage" style="margin-right: 20px;">Home</a>
            <a id="login" href="login" style="margin-right: 20px;">Login</a>
            <a href="#" style="margin-right: 20px;">About Us</a>
            <a href="#" id="contact" style="margin-right: 20px;">Contact Us</a>
            <a href="#", id="account" style="margin-right: 20px;">My account</a>
        </div>
        </nav>

        <h2 style="text-align: center; margin-top: 50px;">Register Here</h2>
        <form style="display: flex; flex-direction: column; align-items: center; margin-top: 30px;">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required style="margin-bottom: 20px; padding: 5px; width: 200px;">
            
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required style="margin-bottom: 20px; padding: 5px; width: 200px;">

            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone" required style="margin-bottom: 20px; padding: 5px; width: 200px;" pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}" placeholder="123-456-7890">
            
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required style="margin-bottom: 20px; padding: 5px; width: 200px;">

            <label for="confirmPassword">Confirm Password:</label>
            <input type="password" id="confirmPassword" name="confirmPassword" required style="margin-bottom: 20px; padding: 5px; width: 200px;">

            
            
            <button type="submit" style="padding: 10px 20px; background-color: beige; border: none; cursor: pointer; border-radius: 5px;">Register</button>
        </form>
</html>
