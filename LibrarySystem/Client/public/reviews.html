<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Miracle's Library </title>


  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@400;500&family=Pacifico&display=swap" rel="stylesheet">
  <link rel="icon" href="static/libraryIcon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Smooch+Sans:wght@100..900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/reviews.css">
</head>

<!-- This index page will be our initial landing page for users whether they be logged in or not -->
<body>
  <!-- This will be our navigation bar -->
  <nav class="navbar">
    <div class="nav-links">
      <a href="/" id="home">Home</a>
      <a href="login" id="login">Login</a>
      <a href="register">Register</a>
      <a href="about">About Us</a>
      <a href="account" id="Account">My Account</a>
      <a id="logout">Logout</a> <!-- Logout functionality will be handled by hte js file accompanied to this file -->
    </div>
  </nav>

    <div class="introSect">
        <h2>Review Books</h2>
        <p>Select a book from below</p>
    </div>

  <div class="reviewSects">  
  <div class="booksToReview" id="bookResults">

  </div>

   <!-- This will contain all the reviews users have made -->
  <div class="seeReviews hide" id="seeReviews">

  </div>
  </div>




  <div class="overlay" id="overlay">
        <div class="popup">
          <h3>Add Review</h3>
          <form id="reviewForm">
            <div id="addReviewPanel">
              <!-- Book details plus review text box will be displayed here -->
            </div>
          <div id="buttonSect">  
            <button id="closePopup" type="button">Close</button>
            <button type="submit" id="submitButton">Submit Review</button>
          </div>  
          </form>
        </div>
    </div>



  <script src="./js/reviews.js"></script>
  <!-- This global script will be put all required html files to handle the login logic -->
  <script defer src="js/global.js"></script>
</body>
</html>
