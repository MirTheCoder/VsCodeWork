<!-- This page will allow admin to see all the users in the database along with info about them-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>See Users</title>
    <link rel="icon" href="static/libraryIcon.png" type="image/png">
    <link rel="stylesheet" href="css/seeUsers.css">
    <link rel="stylesheet" href="css/global.css">
</head>
<body>
    <!-- This is our navigation bar -->
  <nav class="navbar">
    <div class="nav-links">
      <a href="login" id="login">Login</a>
      <a href="indexPage" id="indexPage">Home</a>
      <a href="register">Register</a>
      <a href="about">About Us</a>
      <a href="account" id="Account">My Account</a>
      <a id="logout">Logout</a> <!-- Logout functionality will be handled by hte js file accompanied to this file -->
    </div>
  </nav>
  
    <h1>See Users</h1>
    <div id="userList">
        <!-- User information will be displayed here -->
    </div>

    <div class="overlay" id="overlay">
        <div class="popup">
          <h3>User Details</h3>
          <div id="userDetails">
            <!-- User details will be displayed here -->
          </div>
          <button id="closePopup">Close</button>
        </div>
    </div>

      <!-- This section will be used to contain the information for editing the user data-->
    <div class="overlay" id="editUserOverlay">
        <div class="popup">
          <h3>User Details</h3>
          <div id="userAccountInfo">
            <form id="editUserForm">
              <label for="username">Username:</label>
              <input type="text" id="username" name="username">
              <label for="email">Email:</label>
              <input type="email" id="email" name="email">
              <label for="phone">Phone:</label>
              <input type="telephone" id="phone" name="phone" pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}" placeholder="123-456-7890">

              <h3 class = "radio-group-label"><u>Account Role</u></h3>
              <div class="radio-options"> 
              <input type="radio" id="accountRole" name="accountRole" value="admin" class="radio-option">
              <label for="accountRole">Admin</label>
              <input type="radio" id="accountRole" name="accountRole" value="user" class="radio-option">
              <label for="accountRole">User</label>
              </div>  

              <h3 class = "radio-group-label"><u>Account Status</u></h3>
              <div class="radio-options">
              <input type="radio" id="accountActive" name="accountActive" value="active" class="radio-option">
              <label for="accountActive">Active</label>
              <input type="radio" id="accountActive" name="accountActive" value="inactive" class="radio-option">
              <label for="accountActive">Inactive</label>
              </div>  

              <button type="submit">Save Changes</button>
            </form>
          </div>
          <button id="closeEditPopup">Close</button>
        </div>
    </div>
</body>
<script defer src="js/seeUsers.js"></script>
<script defer src="js/global.js"></script>
</html>
