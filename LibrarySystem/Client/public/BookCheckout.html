<!DOCTYPE html>
<html>
    <head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Book Checkout</title>


  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@400;500&family=Pacifico&display=swap" rel="stylesheet">
  <link rel="icon" href="static/libraryIcon.png" type="image/png">


  <link rel="stylesheet" href="css/bookCheckout.css">
</head>

<body>
    <nav class="navbar">
    <div class="nav-links">
      <a href="indexPage" id="home">Home</a>  
      <a href="login" id="login">Login</a>
      <a href="register">Register</a>
      <a href="about">About Us</a>
      <a href="account" id="Account">My Account</a>
      <a href="users/logout" id="logout">Logout</a>
    </div>
  </nav>

  <!-- This is our title of the page along with where are search bar will be located at-->
   <!--We are going to have a filter system where users can filter
  what kind of books they are looking for-->
  <h2 class="intro">Book Checkout</h2>
  <div class="searchHolder">
  <textarea id="searchBar" rows="1.5" cols="40" class="searchBar" placeholder="Type in book title here"></textarea>
  <button type="button" id="searchButton" class="searchButton">Search</button>
  <form id="filterForm" class="filterForm">
    <select id="genre" name="genre">
        <option value="" disabled selected>Choose a genre</option> <!--This will be our default selected option that can not however be used as an option for genre filter-->
        <option value="Fiction">Fiction</option>
        <option value="Nonfiction">Nonfiction</option>
        <option value="Romance">Romance</option>
        <option value="Mystery">Mystery</option>
        <option value="Thriller">Thriller</option>
        <option value="Fantasy">Fantasy</option>
        <option value="Science Fiction">Science Fiction</option>
        <option value="Historical Fiction">Historical Fiction</option>
    </select> 
    <button type="submit">submit</button>
  </form>
  </div>

  <!--We will have the js file for book checkout populate this section based off what we have in the database -->
  <div class="resultList" id="resultList">
    <p>All results will appear here, feel free to use the filters to find a book</p>
  </div>

<script src="./js/bookCheckout.js"></script>
</body>
</html>
